# GitHub Actions: build for Linux and Windows and upload artifacts
# Triggers on push and PRs. Builds with native toolchains (gcc on Ubuntu, MSYS2/Mingw on Windows).
name: CI — Build and artifact

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-linux:
    name: Build (Linux / Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential

      - name: Build
        run: |
          make -j$(nproc)

      - name: Run quick test (non-failing)
        run: |
          chmod +x tests/test_compile.sh || true
          bash tests/test_compile.sh || echo "test failed (allowed)"

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          if [ -f gpt2_run ]; then cp gpt2_run artifacts/; fi
          make --version > artifacts/make_version.txt || true
          uname -a > artifacts/uname.txt || true
          ls -lah > artifacts/ls.txt || true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gpt2-linux
          path: artifacts

  build-windows:
    name: Build (Windows / MSYS2 Mingw64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true

      - name: Install Mingw toolchain and make
        shell: bash
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm mingw-w64-x86_64-toolchain make
          echo "Installed toolchain"

      - name: Build with Mingw (bash)
        shell: bash
        run: |
          export PATH="/mingw64/bin:$PATH"
          make clean || true
          make -j$(nproc)

      - name: Collect Windows artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          if [ -f gpt2_run.exe ]; then cp gpt2_run.exe artifacts/; fi
          uname -a > artifacts/uname.txt || true
          ls -lah > artifacts/ls.txt || true

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gpt2-windows
          path: artifacts

  # Founder real-time: "ensure all our core repos have auto release non pre release" -- same
  # exact pattern PITVIPER's own ci.yml established (2026-08-21), also just applied to several
  # other core repos this session: auto-bumps MINOR version only on every real push to main
  # (never PRs, never the tag-push this job's own release step triggers), major stays a human
  # call. A REAL release (no --prerelease flag) with both platforms' gpt2_run binary attached.
  release:
    name: 🚀 Tag & Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      # fetch-depth: 0 -- need the full tag history to find the current version;
      # actions/checkout's own default shallow clone doesn't reliably include tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: gpt2-linux
          path: dist/linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: gpt2-windows
          path: dist/windows

      - name: Package release assets
        run: |
          set -euo pipefail
          tar -czf gpt2-linux-x86_64.tar.gz -C dist/linux .
          (cd dist/windows && zip -r ../../gpt2-windows-x86_64.zip .)

      - name: Compute next minor version
        id: version
        run: |
          set -euo pipefail
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            major=0
            minor=0
          else
            ver="${latest#v}"
            major="$(echo "$ver" | cut -d. -f1)"
            minor="$(echo "$ver" | cut -d. -f2)"
          fi
          next_minor=$((minor + 1))
          next="v${major}.${next_minor}.0"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          git tag "$NEXT_VERSION"
          git push origin "$NEXT_VERSION"
          gh release create "$NEXT_VERSION" \
            gpt2-linux-x86_64.tar.gz \
            gpt2-windows-x86_64.zip \
            --title "$NEXT_VERSION" \
            --generate-notes
